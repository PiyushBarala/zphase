name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin | Out-Null
          Write-Host "Downloading yt-dlp.exe..."
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "resources/bin/yt-dlp.exe"
          Write-Host "yt-dlp downloaded: $((Get-Item resources/bin/yt-dlp.exe).Length) bytes"

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Write-Host "Downloading ffmpeg zip..."
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"
          Write-Host "Extracting ffmpeg.exe..."
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD\ffmpeg.zip")
          $ffmpegEntry = $zip.Entries | Where-Object { $_.Name -eq 'ffmpeg.exe' } | Select-Object -First 1
          if ($ffmpegEntry) {
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($ffmpegEntry, "$PWD\resources\bin\ffmpeg.exe", $true)
            Write-Host "ffmpeg extracted: $((Get-Item resources/bin/ffmpeg.exe).Length) bytes"
          } else {
            Write-Error "ffmpeg.exe not found in zip"
            exit 1
          }
          $zip.Dispose()
          Remove-Item "ffmpeg.zip"

      - name: Build renderer and main process
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package Windows installers
        run: npx electron-builder --win --publish never
        env:
          NODE_ENV: production

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $outFile = "dist\checksums-sha256.txt"
          $files = Get-ChildItem dist -Filter "*.exe"
          $lines = @()
          foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($f.Name)"
            Write-Host "$($f.Name): $hash"
          }
          $lines | Set-Content $outFile
          Write-Host "Checksum file written to $outFile"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/checksums-sha256.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
