name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "Tag version: $tag"
          Write-Host "package.json version: $pkg"
          if ($tag -ne $pkg) {
            Write-Error "Tag (v$tag) does not match package.json version ($pkg). Commit the version bump BEFORE creating the tag."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Download yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin | Out-Null
          Write-Host "Downloading yt-dlp.exe..."
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "resources/bin/yt-dlp.exe"
          Write-Host "yt-dlp downloaded: $((Get-Item resources/bin/yt-dlp.exe).Length) bytes"

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Write-Host "Downloading ffmpeg zip..."
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"
          Write-Host "Extracting ffmpeg.exe..."
          # Extract only ffmpeg.exe from the nested bin/ folder
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD\ffmpeg.zip")
          $ffmpegEntry = $zip.Entries | Where-Object { $_.Name -eq 'ffmpeg.exe' } | Select-Object -First 1
          if ($ffmpegEntry) {
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($ffmpegEntry, "$PWD\resources\bin\ffmpeg.exe", $true)
            Write-Host "ffmpeg extracted: $((Get-Item resources/bin/ffmpeg.exe).Length) bytes"
          } else {
            Write-Error "ffmpeg.exe not found in zip"
            exit 1
          }
          $zip.Dispose()
          Remove-Item "ffmpeg.zip"

      - name: Build renderer and main process
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package installer (build only, no publishing)
        run: npx electron-builder --win --publish never
        env:
          NODE_ENV: production

      - name: List build output
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true